spring:
  application:
    name: faltaoque
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type:
          flyway:
            baseline-on-migrate: true
            baseline-version: 1
            validate-on-migrate: true
            locations:
              - classpath:db/migration/schema
              - classpath:db/migration/mocks
          output:
            ansi:
              enabled: always
        server:
          port: 8080